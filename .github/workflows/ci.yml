name: Assembly CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm make python3
      - name: Assemble declared targets
        run: python3 scripts/build.py
      - name: Validate scripted menu
        run: python3 scripts/menu_lint.py
      - name: Build floppy image
        run: make image
      - name: Verify floppy image
        run: make verify
